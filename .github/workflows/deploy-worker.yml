name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'schema.sql'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_BASE: ${{ vars.API_BASE }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Preflight
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN (docs/SETUP.md step 3)"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          grep -q 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml \
            && { echo "::error::wrangler.toml still has the placeholder D1 database_id. Run: npx wrangler d1 create listing-alpha"; exit 1; } \
            || echo "D1 binding configured."

      - name: Apply schema (idempotent)
        run: npx wrangler d1 execute listing-alpha --remote --file=schema.sql --yes

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test against production
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ]; then
            echo "::warning::Repository variable API_BASE is not set; skipping the live smoke test."
            exit 0
          fi
          echo "health:"
          curl -fsS "$API_BASE/api/v1/health" | tee /tmp/health.json
          grep -q '"ok": true' /tmp/health.json
          echo "running one poll cycle:"
          curl -fsS -X POST -H "authorization: Bearer ${ADMIN_TOKEN}" "$API_BASE/api/v1/admin/poll" | tee /tmp/poll.json
          echo "reading events:"
          curl -fsS "$API_BASE/api/v1/events?limit=1" | tee /tmp/events.json
          grep -q '"events"' /tmp/events.json
          echo "deploy verified."
